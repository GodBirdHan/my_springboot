# ===== 应用名称 =====
spring.application.name=my_springboot

# ===== H2 内存数据库配置 =====
# H2 是内嵌数据库，不需要单独安装。数据存在 JVM 内存里，重启后消失 —— 适合开发测试。
spring.datasource.url=jdbc:h2:mem:testdb          # mem = 内存模式，testdb = 数据库名
spring.datasource.driver-class-name=org.h2.Driver  # H2 的 JDBC 驱动
spring.datasource.username=sa                      # H2 默认用户名
spring.datasource.password=                        # H2 默认密码为空

# ===== JPA 配置 =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect  # 告诉 JPA 我们用 H2 方言
spring.jpa.hibernate.ddl-auto=update                          # 自动建表/更新表结构，不删已有数据
spring.h2.console.enabled=true                                # 开启 H2 Web 控制台（http://localhost:8080/h2-console）
